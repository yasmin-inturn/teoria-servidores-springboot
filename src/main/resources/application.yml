spring:
  application:
    name: loja-virtual
  thymeleaf:
    cache: false

server:
  port: 8080

# Health check para provar, ao vivo, um dos pontos fortes citados na pagina.
management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    nome: Atividade de Servidores - Java + Spring Boot

# ---------------------------------------------------------------------------
# Conteudo da pagina de documentacao servida em GET /.
# Editar daqui para baixo nao exige recompilar nem mexer no HTML.
# ---------------------------------------------------------------------------
documentacao:
  titulo: "Java + Spring Boot"
  disciplina: "Programacao Web - Atividade Pratica: Servidores"
  instituicao: "UNIVALI"
  comando-execucao: "./mvnw spring-boot:run"

  participantes:
    - nome: "Yasmin Inturn"
    - nome: "Kleyton"
    - nome: "Maria Isabel Henke"

  pontos-fortes:
    - titulo: "Tipagem forte"
      texto: >
        O compilador cobra o contrato antes de o servidor subir: um campo com o tipo errado
        quebra o build, nao a requisicao do cliente. Isso evita uma classe inteira de bugs
        que em linguagens dinamicas so aparecem em tempo de execucao.

    - titulo: "Injecao de dependencias"
      texto: >
        Cada classe declara do que precisa no construtor (@Service, @RestController) e o
        Spring monta o grafo de objetos sozinho. O resultado e codigo desacoplado e facil de
        testar, sem new() espalhado pela aplicacao.

    - titulo: "Servidor embarcado"
      texto: >
        Nao existe servidor de aplicacao para instalar a parte: o Tomcat vem dentro do jar e
        o metodo main() e o proprio servidor. "java -jar" sobe tudo.

    - titulo: "Auto-configuracao"
      texto: >
        O Spring Boot olha o que esta no classpath (Tomcat, Jackson, Thymeleaf, Actuator) e
        liga cada peca com um padrao sensato - sem XML, com a opcao de sobrescrever qualquer
        parte quando a convencao nao serve.

    - titulo: "Ecossistema maduro"
      texto: >
        Validacao de dados (Bean Validation), serializacao JSON (Jackson) e metricas
        (Actuator) ja vem prontos e testados em producao por milhares de empresas - nao
        precisa escrever nem escolher essas pecas do zero.

  caso-de-uso-ideal: >
    Uma plataforma de e-commerce com API REST ilustra bem onde o Spring Boot brilha: catalogo
    de produtos, carrinho, pedidos, pagamentos e estoque, com regras de negocio como calculo
    de frete, descontos e validacao de estoque. A tipagem forte do Java e a injecao de
    dependencias do Spring ajudam a manter esse tipo de codigo organizado e testavel, e
    bibliotecas como Spring Security (login e perfis) e Spring Data JPA (persistencia) cobrem
    o resto sem reinventar nada. Esse mesmo framework nao compensa para uma landing page
    simples ou um script pequeno: o custo de configuracao inicial e o consumo de memoria do
    Tomcat embarcado so se pagam quando a aplicacao cresce.

  prerequisitos:
    - "JDK 17 ou superior (este projeto usa o Java 25 LTS)"
    - "Maven 3.6.3+ (ou o wrapper ./mvnw, que baixa o Maven sozinho)"
    - "Uma IDE com suporte a Maven - usamos o IntelliJ IDEA"

  # Passos iguais nos tres sistemas, antes de abrir o terminal.
  setup-comum:
    - "Instalar um JDK 17+ (ex.: Eclipse Temurin ou Microsoft Build of OpenJDK)"
    - "Gerar o esqueleto do projeto em https://start.spring.io (Spring Initializr)"
    - "Extrair o .zip e abrir a pasta com o pom.xml no IntelliJ IDEA -> 'Trust Project'"

  # Daqui pra baixo e so o que muda de um sistema operacional para o outro:
  # como confirmar o JDK instalado, como configurar o JAVA_HOME e qual script
  # do wrapper rodar (mvnw no Linux/macOS, mvnw.cmd no Windows).
  setup-linux:
    - "java -version && javac -version"
    - "export JAVA_HOME=/usr/lib/jvm/java-25-openjdk   # ajuste para o caminho da sua distro"
    - "export PATH=$JAVA_HOME/bin:$PATH"
    - "chmod +x mvnw                 # garante que o wrapper pode ser executado"
    - "./mvnw spring-boot:run        # baixa as dependencias e sobe o servidor"
    - "# abrir http://localhost:8080 no navegador"

  setup-macos:
    - "java -version && javac -version"
    - "export JAVA_HOME=$(/usr/libexec/java_home -v 25)"
    - "export PATH=$JAVA_HOME/bin:$PATH"
    - "./mvnw spring-boot:run        # baixa as dependencias e sobe o servidor"
    - "# abrir http://localhost:8080 no navegador"

  setup-windows:
    - "java -version"
    - "javac -version"
    - ":: Painel de Controle > Variaveis de Ambiente > Novo: JAVA_HOME = C:\\Program Files\\...\\jdk-25"
    - ":: Editar a variavel Path e adicionar %JAVA_HOME%\\bin"
    - "mvnw.cmd spring-boot:run       # baixa as dependencias e sobe o servidor"
    - ":: abrir http://localhost:8080 no navegador"

  conclusao:
    dificuldade: >
      A maior dificuldade inicial foi entender o que o framework faz sozinho. Muita coisa
      acontece por convencao e fica invisivel para quem esta comecando: quem criou o Tomcat,
      de onde vem a validacao automatica do JSON, por que um bean "simplesmente funciona" sem
      ninguem ter instanciado ele em lugar nenhum.
    recomendacao: >
      Comecar pelo Spring Initializr com poucas dependencias (so Web e Thymeleaf, por
      exemplo) e ir adicionando uma de cada vez, olhando o log de inicializacao a cada passo.
      Isso torna visivel o que cada starter liga sozinho, em vez de herdar um projeto grande
      e tentar entender tudo de uma vez.
